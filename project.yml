name: PlatoNotes
options:
  bundleIdPrefix: com.johnseong
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: Z64KRUX3W3
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "4"
    TARGETED_DEVICE_FAMILY: "1,2"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CODE_SIGN_IDENTITY: Apple Development
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    GCC_C_LANGUAGE_STANDARD: gnu17
  configs:
    Release:
      VALIDATE_PRODUCT: YES
targets:
  PlatoNotes:
    type: application
    platform: iOS
    sources:
      - path: PlatoNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnseong.PlatoNotes
        PRODUCT_NAME: $(TARGET_NAME)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"PlatoNotes/Preview Content\""
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  PlatoNotesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PlatoNotesTests
      - path: StoreKit/TipJar.storekit
        buildPhase: resources
    dependencies:
      - target: PlatoNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnseong.PlatoNotesTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PlatoNotes:
    build:
      targets:
        PlatoNotes: all
        PlatoNotesTests: [test]
    run:
      config: Debug
      storeKitConfiguration: StoreKit/TipJar.storekit
    test:
      config: Debug
      targets:
        - PlatoNotesTests
    archive:
      config: Release
